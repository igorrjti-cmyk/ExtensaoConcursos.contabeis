<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 480px; max-height: 600px;
      padding: 14px;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #060E20; color: #fff;
      display: flex; flex-direction: column; gap: 10px;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
    }
    h3 {
      font-size: 13px; font-weight: 800;
      background: linear-gradient(90deg,#00C896,#00E5A8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .versao { font-size: 9px; color: rgba(255,255,255,.2); }
    .status {
      padding: 8px 12px; border-radius: 8px; font-size: 11px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04); color: rgba(255,255,255,.5);
    }
    .status.feed    { border-color: rgba(0,200,150,.3);   color: #00C896; background: rgba(0,200,150,.06); }
    .status.stories { border-color: rgba(225,48,108,.3);  color: #E1306C; background: rgba(225,48,108,.06); }
    .status.ok      { border-color: rgba(255,255,255,.1); color: rgba(255,255,255,.35); }
    .status.erro    { border-color: rgba(255,75,75,.3);   color: #FF4B4B; background: rgba(255,75,75,.06); }
    .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; animation: pulse 1.5s infinite; }
    .dot.verde { background:#00C896; } .dot.rosa { background:#E1306C; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .logs-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; color: rgba(255,255,255,.3); letter-spacing: 1px;
      text-transform: uppercase;
    }
    .logs-header button {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.4); border-radius: 5px; padding: 3px 8px;
      font-size: 9px; cursor: pointer;
    }
    .logs-header button:hover { background: rgba(255,75,75,.1); color: #FF4B4B; border-color: rgba(255,75,75,.2); }

    #logBox {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.06);
      border-radius: 8px; padding: 8px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 10px; line-height: 1.6;
      max-height: 420px;
    }
    .log-entry { margin-bottom: 3px; word-break: break-word; }
    .log-entry.info  { color: rgba(255,255,255,.65); }
    .log-entry.warn  { color: #FFB800; }
    .log-entry.erro  { color: #FF4B4B; font-weight: 700; }
    .log-time { color: rgba(255,255,255,.2); font-size: 9px; margin-right: 5px; }

    .log-dados {
      margin-left: 16px; margin-top: 2px; padding: 4px 8px;
      background: rgba(255,255,255,.04); border-left: 2px solid rgba(255,255,255,.1);
      border-radius: 0 4px 4px 0; color: rgba(255,255,255,.4);
      font-size: 9px; white-space: pre-wrap; max-height: 120px; overflow-y: auto;
    }
    .log-dados.expandivel { cursor: pointer; }
    .log-dados.expandivel:hover { background: rgba(255,255,255,.07); }

    .empty { color: rgba(255,255,255,.2); text-align: center; padding: 20px; font-size: 11px; }

    button#btnLimpar {
      width: 100%; background: rgba(255,75,75,.1);
      border: 1px solid rgba(255,75,75,.2); color: #FF4B4B;
      border-radius: 7px; padding: 7px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    button#btnLimpar:hover { opacity: .8; }
    button#btnLimpar { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h3>Concursos Contábeis</h3>
    <span class="versao">v2.4 — debug</span>
  </div>

  <div class="status ok" id="status">✓ Nenhuma publicação pendente</div>

  <div class="logs-header">
    <span>📋 Logs em tempo real</span>
    <button id="btnClearLogs">Limpar logs</button>
  </div>

  <div id="logBox"><div class="empty">Nenhum log ainda.<br>Clique em Publicar no painel para ver o processo.</div></div>

  <button id="btnLimpar">✕ Cancelar publicação pendente</button>

  <script src="popup.js"></script>
</body>
</html>
